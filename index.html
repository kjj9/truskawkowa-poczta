</style></head><body><div class="berry-burst" id="berry-burst" aria-hidden="true"></div><main id="main"><img class="decoration" src="strawberry.png" alt="" aria-hidden="true"><img class="decoration second" src="strawberry.png" alt="" aria-hidden="true"><p class="greeting">heeej truskawa,<br>tu znowu malina</p><h1 class="headline">A jaaaak się już<br><em>zastanowisz…</em></h1><section class="machine" id="letter" aria-labelledby="question"><img class="machine-berry" src="strawberry.png" alt="" aria-hidden="true"><div class="machine-lights" aria-hidden="true"><span style="--lamp:0"></span><span style="--lamp:1"></span><span style="--lamp:2"></span><span style="--lamp:3"></span><span style="--lamp:4"></span><span style="--lamp:5"></span><span style="--lamp:6"></span><span style="--lamp:7"></span><span style="--lamp:8"></span></div><h2 class="question" id="question">to bardziej pasuje Ci:</h2><div class="answers" aria-label="Kiedy bardziej Ci pasuje"><button class="ticket" data-answer="weekend" aria-pressed="false"><span class="ticket-stub" aria-hidden="true">SOB<br>ND</span><span class="ticket-face"><span>W weekend</span><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button><button class="ticket" data-answer="weekday" aria-pressed="false"><span class="ticket-stub" aria-hidden="true">PON<br>–<br>PT</span><span class="ticket-face"><span>W tygodniu</span><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button></div><div class="slot" aria-hidden="true"></div></section><div class="receipt result" id="result" aria-live="polite" aria-atomic="true" hidden><h3 id="result-title"></h3><p id="result-info"></p><p id="status" class="status" role="status"></p></div></main><script>
const main=document.querySelector('#main'),letter=document.querySelector('#letter');
function strawberryBurst(origin){const area=document.querySelector('#berry-burst'),r=origin.getBoundingClientRect();for(let i=0;i<18;i++){const piece=document.createElement('img');piece.src='strawberry.png';piece.alt='';piece.className='burst-berry';piece.style.left=(r.left+r.width/2)+'px';piece.style.top=(r.top+r.height*.6)+'px';area.append(piece);const dx=(Math.random()-.5)*420,dy=-100-Math.random()*180;const motion=piece.animate([{transform:'translate(-50%,-50%) scale(.3)',opacity:0},{transform:'translate('+dx*.5+'px,'+dy+'px) rotate(70deg)',opacity:1,offset:.45},{transform:'translate('+dx+'px,180px) rotate(180deg) scale(.5)',opacity:0}],{duration:1400+Math.random()*500,easing:'cubic-bezier(.22,.55,.55,1)',fill:'forwards'});motion.finished.then(()=>piece.remove()).catch(()=>piece.remove());}}
const answers={weekend:{label:'W weekend',title:'Weekend brzmi słodko ♡'},weekday:{label:'W tygodniu',title:'W tygodniu też super ♡'}};
const responseButtons=[...document.querySelectorAll('[data-answer]')];let responseSending=false,lastSavedAnswer=null;
async function sendAnswer(button){
 if(responseSending)return;
 const key=button.dataset.answer,answer=answers[key];if(!answer)return;
 const result=document.querySelector('#result'),title=document.querySelector('#result-title'),info=document.querySelector('#result-info'),status=document.querySelector('#status');
 result.hidden=false;main.classList.add('responded');status.textContent='';
 if(key===lastSavedAnswer){title.textContent=answer.title;info.textContent='Twój wybór już dotarł do Maliny.';return;}
 const endpoint=document.querySelector('meta[name="response-endpoint"]').content.trim();
 if(!/^https:\/\/formspree\.io\/f\/[a-zA-Z0-9]+$/.test(endpoint)){title.textContent='Jeszcze chwilka…';info.textContent='Wysyłanie odpowiedzi nie jest jeszcze dostępne. Spróbuj później.';return;}
 responseSending=true;responseButtons.forEach(b=>b.disabled=true);result.setAttribute('aria-busy','true');title.textContent='Drukuję Twój wybór…';info.textContent='';
 const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),15000);
 try{
  const response=await fetch(endpoint,{method:'POST',headers:{'Accept':'application/json','Content-Type':'application/json'},body:JSON.stringify({response:answer.label,recipient:'Truskawa',movie:'Primetime',stage:'Wybór terminu',_subject:'Truskawa wybiera termin seansu'}),signal:controller.signal});
  if(!response.ok)throw Error('Submission failed');
  lastSavedAnswer=key;responseButtons.forEach(b=>b.setAttribute('aria-pressed',String(b===button)));title.textContent=answer.title;info.textContent='Twój wybór dotarł do Maliny.';
  if(key==='weekend'||key==='weekday'){strawberryBurst(letter,true);letter.classList.remove('party');void letter.offsetWidth;letter.classList.add('party');setTimeout(()=>letter.classList.remove('party'),700);}
 }catch(error){title.textContent='Nie udało się wysłać.';info.textContent='Odpowiedź nie została potwierdzona. Sprawdź internet i kliknij ponownie.';}
 finally{clearTimeout(timeout);responseSending=false;responseButtons.forEach(b=>b.disabled=false);result.removeAttribute('aria-busy');result.scrollIntoView({block:'nearest',behavior:'smooth'});}
}
responseButtons.forEach(button=>button.addEventListener('click',()=>sendAnswer(button)));
</script></body></html>
