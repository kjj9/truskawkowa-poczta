open.focus({preventScroll:true});}document.querySelector('#close').addEventListener('click',closeLetter);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&main.classList.contains('opened'))closeLetter();});const answers={yes:{label:'Tak',title:'Słodko! To widzimy się ♡'},maybe:{label:'Zastanowię się',title:'Jasne, spokojnie ♡'},no:{label:'Nie tym razem',title:'Jasne, rozumiem ♡'}};

 result.hidden=false;main.classList.add('responded');status.textContent='';

 const endpoint=document.querySelector('meta[name="response-endpoint"]').content.trim();
 if(!/^https:\/\/formspree\.io\/f\/[a-zA-Z0-9]+$/.test(endpoint)){title.textContent='Jeszcze chwilka…';info.textContent='Wysyłanie odpowiedzi nie jest jeszcze dostępne. Spróbuj później.';return;}
 responseSending=true;responseButtons.forEach(b=>b.disabled=true);result.setAttribute('aria-busy','true');title.textContent='Wysyłam odpowiedź…';info.textContent='';
